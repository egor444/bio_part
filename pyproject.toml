[build-system]
requires = ["setuptools>=69.5"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-part"             
version = "0.1.0"
description = "A package to analyse and partition protein datasets based on physiochemical properties."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"                 
license-files = ["LICEN[CS]E*"]
authors = [
  { name = "Egor Rakcheev", email = "egor.rakcheev@tum.de" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas",
    "numpy",
    "biopython",
    "scikit-learn",
    "scipy",
    "joblib",
    "matplotlib",
]

[project.scripts]
bio-part = "bio_part.main:main"

[tool.setuptools.packages.find]
where = ["src"]